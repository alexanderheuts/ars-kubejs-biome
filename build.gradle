plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("src/generated/**/.cache")
}

sourceSets {
    clientDev
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup('maven.modrinth') }
    }
    maven {
        name = 'Illusive Soulworks'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup('top.theillusivec4.curios') }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup('software.bernie.geckolib') }
    }
    maven {
        name = 'Latvian Dev'
        url = 'https://maven.latvian.dev/releases'
        content { includeGroup('dev.latvian.mods') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup('mezz.jei')
            includeGroup('net.mezzdev.config')
        }
    }
}

base {
    archivesName = mod_id
}

tasks.named('jar', Jar).configure {
    from(['LICENSE', 'TEMPLATE_LICENSE.txt']) {
        into 'META-INF'
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def runModId = providers.gradleProperty('mod_id').get()

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            sourceSet = sourceSets.clientDev
            systemProperty 'neoforge.enabledGameTestNamespaces', runModId
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', runModId
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', runModId
        }

        data {
            data()
            programArguments.addAll '--mod', runModId, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // NeoForge 1.21.1 discovers these mods on the run source set's runtime classpath.
    clientDevRuntimeClasspath.extendsFrom runtimeClasspath
}

dependencies {
    implementation "maven.modrinth:TKB6INcv:${ars_nouveau_release}"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // The distribution JAR bundles KubeJS's other runtime libraries.
    implementation("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
    implementation "dev.latvian.mods:rhino:${rhino_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    clientDevRuntimeOnly sourceSets.main.output
    clientDevRuntimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    clientDevRuntimeOnly "net.mezzdev.config:mezz_config-${minecraft_version}-neoforge:${mezz_config_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            ars_nouveau_version    : ars_nouveau_version,
            kubejs_version         : kubejs_version,
            jei_version            : jei_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' 
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
